name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          # Node 20 reached end of life in April 2026 — no more security
          # patches. 22 has been in maintenance since October 2025; 24 is the
          # current Active LTS and has the longest runway, so that is the pin.
          #
          # One thing this bump gives up, deliberately: CI on Node 20 had
          # ACCIDENTALLY been catching solutions that used ES2025 Set methods,
          # because those landed in Node 22. That protection is no longer
          # incidental — `playgroundExecutable.test.ts` strips the seven new
          # Set methods and re-runs every solution, so it holds on any Node.
          node-version: 24
          cache: 'npm'

      - name: Install dependencies 🔧
        run: npm install

      # Type errors and lint errors fail the deploy. These run before the
      # content steps so a code error surfaces as fast as possible.
      # data.ts imports src/generated/content-meta.json, so it must exist before
      # the typecheck. Generated rather than committed so it can never go stale.
      - name: Generate content metadata 🗂️
        run: npm run content:meta

      # Both generated + gitignored, and both are imported by src/, so they must
      # exist before the typecheck runs.
      - name: Generate playground index 🧩
        run: npm run playground:index

      - name: Typecheck 🔎
        run: npm run typecheck

      - name: Lint 🧹
        run: npm run lint

      - name: Unit tests 🧪
        run: npm run test

      # Guards the guards: an ESLint glob that matches no application file, a
      # storage call that bypasses the safe wrapper, an eager content glob, a
      # renamed vendor chunk. Each of these has silently broken before.
      - name: Verify architecture invariants 🏛️
        run: npm run verify:arch

      # Every runnable code block gets a "Try it" button in the app, so one
      # that cannot parse ships a guaranteed-failing button. Ratcheted against
      # scripts/code-block-baseline.json — counts may fall, never rise.
      - name: Verify code blocks 🧩
        run: npm run verify:blocks

      - name: Prepare content 📝
        run: node scripts/prepare-content.js

      # Fails the deploy if the counts stated in README.md, CLAUDE.md or the
      # app's Introduction page have drifted from the actual content. Runs
      # BEFORE the build so a stale claim is caught in seconds, not minutes.
      - name: Verify content counts 🔢
        run: npm run verify:counts

      - name: Build 🏗️
        run: npm run build

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
