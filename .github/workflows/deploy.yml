name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies 🔧
        run: npm install

      - name: Prepare content 📝
        run: node scripts/prepare-content.js

      # Fails the deploy if the counts stated in README.md, CLAUDE.md or the
      # app's Introduction page have drifted from the actual content. Runs
      # BEFORE the build so a stale claim is caught in seconds, not minutes.
      - name: Verify content counts 🔢
        run: npm run verify:counts

      - name: Build 🏗️
        run: npm run build

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
