    <title>PrepHub: Interview Prep</title>
      <!--
      Theme must be resolved BEFORE first paint. `body` is styled
      `bg-canvas` (#0f1220 in dark mode), and the `dark` class was only added by
      useDarkMode's effect — which runs after the main bundle downloads, parses
      and mounts React. On a slow connection that left a white page for several
      seconds before flipping to dark. This is the same blocking-script fix the
      Theme Switcher playground template documents.

      Keep it inline, synchronous and in <head>: a deferred or external script
      would paint first and defeat the point. Wrapped in try/catch because
      localStorage throws in some privacy modes.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            // Paint the right colour even before the CSS bundle arrives.
            document.documentElement.style.backgroundColor = '#0f1220';
          }
        } catch (e) { /* localStorage unavailable — fall through to light */ }
      })();
    </script>

    <!-- GitHub Pages SPA redirect handler (works with 404.html) -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
